<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CF-Book · 下载</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="library-page">
    <header class="topbar library-topbar">
      <a class="library-brand" href="/library" aria-label="CF-Book 书库">
        <span class="library-mark">观</span><strong>CF-Book</strong>
      </a>
      <details class="library-menu">
        <summary aria-label="展开导航菜单"><span></span><span></span><span></span></summary>
        <div class="library-menu-list">
          <a href="/library">书库</a><a href="/">上传</a><a href="/download" class="active">下载</a>
          <div id="user-area" class="user-area"></div>
        </div>
      </details>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换到暗色模式">暗色</button>
    </header>

    <main class="shell library-shell">
      <section class="panel">
        <h2>下载队列</h2>
        <div class="queue-toolbar">
          <label>同时下载
            <select id="concurrency">
              <option value="1">1 本</option>
              <option value="2">2 本</option>
              <option value="3">3 本</option>
              <option value="4">4 本</option>
            </select>
          </label>
          <button id="pause-all" type="button">全部暂停</button>
          <button id="resume-all" type="button">全部继续</button>
          <button id="clear-finished" type="button">清理已结束</button>
          <span id="queue-summary" class="form-msg"></span>
        </div>
        <ul id="download-queue" class="task-list"></ul>
      </section>

      <section class="panel">
        <h2>已入库任务</h2>
        <div class="library-bar">
          <input id="task-search" type="search" placeholder="搜索文件名" />
          <label class="queue-inline">状态
            <select id="task-status">
              <option value="">全部</option>
              <option value="completed">已入库</option>
              <option value="active">上传中</option>
              <option value="aborted">已中止</option>
            </select>
          </label>
          <button id="queue-all-completed" type="button">已入库全部加入队列</button>
        </div>
        <table id="tasks" class="tasks">
          <thead>
            <tr><th>文件名</th><th>大小</th><th>分块</th><th>状态</th><th></th></tr>
          </thead>
          <tbody></tbody>
        </table>
        <p id="tasks-msg" class="form-msg"></p>
      </section>

      <section class="panel">
        <h2>下载历史</h2>
        <ul id="download-history" class="task-list"></ul>
      </section>
    </main>

    <script type="module" src="/nav.js"></script>
    <script type="module" src="/download.js"></script>
  </body>
</html>
