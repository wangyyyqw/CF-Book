<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CF-Book · 分块传输原型</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>CF-Book 分块传输原型</h1>
      <nav>
        <a href="/library">书库</a>
        <a href="/">上传</a>
        <a href="/download">下载</a>
      </nav>
      <div id="user-area" class="user-area"></div>
    </header>

    <main class="shell">
      <section class="panel">
        <h2>批量上传书籍</h2>
        <input id="file" type="file" multiple />
        <p id="file-summary" class="form-msg">可一次选择多本书，系统会按顺序上传。</p>
        <ul id="file-queue" class="upload-queue"></ul>
        <div class="actions">
          <button id="start">开始上传</button>
          <button id="abort" disabled>中止</button>
        </div>
        <div id="progress-wrap" class="progress-wrap" hidden>
          <div id="progress" class="progress"></div>
          <div id="speed" class="speed">0.0 MB/s</div>
        </div>
        <ul id="log" class="log"></ul>
      </section>
    </main>

    <script type="module" src="/nav.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
