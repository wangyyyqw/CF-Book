<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CF-Book · 上传任务</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="library-page">
    <header class="topbar library-topbar">
      <a class="library-brand" href="/library" aria-label="CF-Book 书库">
        <span class="library-mark">观</span><strong>CF-Book</strong>
      </a>
      <details class="library-menu">
        <summary aria-label="展开导航菜单"><span></span><span></span><span></span></summary>
        <div class="library-menu-list">
          <a href="/library">书库</a><a href="/" class="active">上传</a><a href="/download">下载</a>
          <div id="user-area" class="user-area"></div>
        </div>
      </details>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换到暗色模式">暗色</button>
    </header>

    <main class="shell library-shell">
      <section class="panel">
        <h2>上传任务</h2>
        <div class="queue-toolbar">
          <label class="btn-cover">选择书籍文件<input id="file" type="file" multiple hidden /></label>
          <button id="start-all" type="button">全部开始</button>
          <button id="pause-all" type="button">全部暂停</button>
          <button id="cleanup-stale" type="button">清理长期失效任务</button>
          <button id="clear-finished" type="button">清理已结束</button>
          <span id="queue-summary" class="form-msg"></span>
        </div>
        <p id="file-summary" class="form-msg">可一次选择多本书，任务会保存在浏览器里，刷新页面后可继续。</p>
        <ul id="upload-queue" class="task-list"></ul>
      </section>

      <section class="panel">
        <h2>日志</h2>
        <ul id="log" class="log"></ul>
      </section>
    </main>

    <script type="module" src="/nav.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
