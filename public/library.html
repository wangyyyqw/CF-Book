<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CF-Book · 书库</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="library-page catalog-page">
    <header class="topbar library-topbar">
      <a class="library-brand" href="/library" aria-label="CF-Book 书库">
        <span class="library-mark">观</span>
        <strong>CF-Book</strong>
      </a>
      <details class="library-menu">
        <summary aria-label="展开导航菜单"><span></span><span></span><span></span></summary>
        <div class="library-menu-list">
          <a href="/library" class="active">书库</a>
          <a href="/">上传</a>
          <a href="/download">下载</a>
          <div id="user-area" class="user-area"></div>
        </div>
      </details>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换到暗色模式">暗色</button>
    </header>

    <main class="shell library-shell">
      <section class="library-hero">
        <div class="library-title-row">
          <h1 class="library-eyebrow">馆藏</h1>
          <span id="count"></span>
        </div>
        <p class="library-intro">一架旧书，半窗灯火。这里停着读过的、想读的，与舍不得读完的。</p>
        <details class="shelf-manager">
          <summary>管理书架</summary>
          <form id="shelf-create" class="shelf-create">
            <input id="shelf-name" maxlength="24" placeholder="新书架名称（最多 24 字）" aria-label="新书架名称" />
            <select id="shelf-scope" aria-label="书架可见范围">
              <option value="personal">个人书架</option>
              <option value="shared">共享书架（仅管理员）</option>
            </select>
            <button type="submit">新建书架</button>
            <span id="shelf-create-msg" class="form-msg"></span>
          </form>
          <ul id="shelf-list" class="shelf-list"></ul>
        </details>
      </section>
      <section class="recommend-section" aria-labelledby="recommend-title">
        <div class="section-heading">
          <div>
            <p class="library-eyebrow">今日翻阅</p>
            <h2 id="recommend-title">值得一看的书</h2>
          </div>
          <div class="recommend-tools">
            <span id="recommend-note" class="section-note"></span>
            <button id="refresh-recommendations" class="recommend-refresh" type="button">换一批</button>
          </div>
        </div>
        <div id="recommend-books" class="books recommend-books"></div>
      </section>
      <section class="library-bar">
        <input id="search" type="search" placeholder="搜索书名 / 作者 / 简介" aria-label="搜索书籍" />
        <select id="status" aria-label="阅读状态">
          <option value="">全部状态</option>
          <option value="unread">未读</option>
          <option value="reading">在读</option>
          <option value="read">已读</option>
          <option value="favorite">收藏</option>
        </select>
        <select id="tag-filter" aria-label="标签分类">
          <option value="">全部标签</option>
        </select>
        <select id="shelf-filter" aria-label="自定义书架">
          <option value="">全部书架</option>
        </select>
        <select id="sort" aria-label="排序方式">
          <option value="time-desc">最新上传</option>
          <option value="time-asc">最早上传</option>
          <option value="title-asc">书名 A→Z</option>
          <option value="title-desc">书名 Z→A</option>
          <option value="author-asc">作者 A→Z</option>
          <option value="author-desc">作者 Z→A</option>
          <option value="rating-desc">评分从高到低</option>
          <option value="rating-asc">评分从低到高</option>
          <option value="size-desc">文件从大到小</option>
          <option value="size-asc">文件从小到大</option>
        </select>
      </section>
      <div id="books" class="books"></div>
      <nav class="pagination" aria-label="书库分页">
        <button id="previous-page" type="button" disabled>上一页</button>
        <span id="page-indicator" aria-live="polite"></span>
        <button id="next-page" type="button" disabled>下一页</button>
      </nav>
    </main>

    <script type="module" src="/nav.js"></script>
    <script type="module" src="/library.js"></script>
  </body>
</html>
