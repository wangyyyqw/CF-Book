<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CF-Book · 书库</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="library-page">
    <header class="topbar library-topbar">
      <a class="library-brand" href="/library" aria-label="CF-Book 书库">
        <span class="library-mark">观</span>
        <strong>CF-Book</strong>
      </a>
      <nav>
        <a href="/library" class="active">图书</a>
        <a href="/">上传</a>
        <a href="/download">下载</a>
      </nav>
      <div class="library-actions">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换到暗色模式">暗色</button>
        <div id="user-area" class="user-area"></div>
      </div>
    </header>

    <main class="shell library-shell">
      <section class="library-hero">
        <p class="library-eyebrow">馆藏</p>
        <div class="library-title-row">
          <h1>书架</h1>
          <span id="count"></span>
        </div>
        <p class="library-intro">一架旧书，半窗灯火。这里停着读过的、想读的，与舍不得读完的。</p>
      </section>
      <section class="recommend-section" aria-labelledby="recommend-title">
        <div class="section-heading">
          <div>
            <p class="library-eyebrow">今日翻阅</p>
            <h2 id="recommend-title">值得一看的书</h2>
          </div>
          <span class="section-note">精选 9 本</span>
        </div>
        <div id="recommend-books" class="books recommend-books"></div>
      </section>
      <section class="library-bar">
        <input id="search" type="search" placeholder="搜索书名 / 作者 / 简介" />
        <select id="status">
          <option value="">全部状态</option>
          <option value="unread">未读</option>
          <option value="reading">在读</option>
          <option value="read">已读</option>
          <option value="favorite">收藏</option>
        </select>
        <select id="tag-filter" aria-label="标签分类">
          <option value="">全部标签</option>
        </select>
      </section>
      <div id="books" class="books"></div>
      <div class="more-row"><button id="more" class="more-btn" hidden>加载更多</button></div>
    </main>

    <script type="module" src="/nav.js"></script>
    <script type="module" src="/library.js"></script>
  </body>
</html>
