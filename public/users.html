<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CF-Book · 账号管理</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>CF-Book 账号管理</h1>
      <nav>
        <a href="/library">书库</a>
        <a href="/">上传</a>
        <a href="/download">下载</a>
        <a href="/users" class="active">账号</a>
      </nav>
      <div id="user-area" class="user-area"></div>
    </header>

    <main class="shell">
      <section class="panel">
        <h2>新建账号</h2>
        <form id="create-form" class="inline-form">
          <input id="new-username" placeholder="用户名（字母/数字/._-）" autocomplete="off" required />
          <input id="new-display" placeholder="显示名称（可选）" autocomplete="off" />
          <input id="new-password" type="password" placeholder="初始密码（至少 6 位）" autocomplete="new-password" required />
          <select id="new-role">
            <option value="member">成员</option>
            <option value="admin">管理员</option>
          </select>
          <button type="submit">创建</button>
          <span id="create-msg" class="form-msg"></span>
        </form>
      </section>

      <section class="panel">
        <h2>账号列表</h2>
        <table class="tasks" id="user-table">
          <thead>
            <tr>
              <th>用户名</th>
              <th>显示名称</th>
              <th>角色</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <span id="list-msg" class="form-msg"></span>
      </section>

      <section class="panel">
        <h2>AI 书名与标签整理</h2>
        <p class="form-msg">先查询公开书目资料，再由 Workers AI 清理书名并生成 3 个共享标签；不会上传书籍原文件。额度按模型返回 token 估算，最终账单以 Cloudflare 控制台为准。</p>
        <div class="ai-usage-grid" id="ai-usage">
          <span>正在读取今日额度…</span>
        </div>
        <div class="ai-meter" aria-label="今日 AI 额度使用情况"><i id="ai-meter-fill"></i></div>
        <div class="actions-row">
          <button id="ai-classify" type="button">整理现有书籍</button>
          <span id="ai-msg" class="form-msg"></span>
        </div>
      </section>

      <section class="panel">
        <h2>修改我的密码</h2>
        <form id="password-form" class="inline-form">
          <input id="current-password" type="password" placeholder="当前密码" autocomplete="current-password" required />
          <input id="next-password" type="password" placeholder="新密码（至少 6 位）" autocomplete="new-password" required />
          <button type="submit">保存</button>
          <span id="password-msg" class="form-msg"></span>
        </form>
      </section>
    </main>

    <script type="module" src="/nav.js"></script>
    <script type="module" src="/users.js"></script>
  </body>
</html>
