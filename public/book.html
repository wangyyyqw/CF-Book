<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CF-Book · 书籍详情</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="library-page book-page">
    <header class="topbar library-topbar">
      <a class="library-brand" href="/library" aria-label="CF-Book 书库">
        <span class="library-mark">观</span><strong>CF-Book</strong>
      </a>
      <details class="library-menu">
        <summary aria-label="展开导航菜单"><span></span><span></span><span></span></summary>
        <div class="library-menu-list">
          <a href="/library" class="active">书库</a><a href="/">上传</a><a href="/download">下载</a>
          <div id="user-area" class="user-area"></div>
        </div>
      </details>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换到暗色模式">暗色</button>
    </header>

    <main class="shell library-shell">
      <section class="page-heading compact-heading">
        <a class="back-link" href="/library">← 返回书库</a>
        <p class="library-eyebrow">书目 / 详情</p>
      </section>
      <section class="panel book-form">
        <div class="book-cover">
          <img id="cover" alt="封面" />
          <span id="cover-placeholder" class="cover-placeholder" hidden></span>
        </div>
        <div class="book-fields">
          <h1 id="book-title">加载中…</h1>
          <p class="book-meta" id="book-meta"></p>

          <div class="book-tag-summary">
            <p class="book-section-label">共享分类</p>
            <div id="tag-groups" class="tag-groups"></div>
          </div>

          <div class="state-row">
            <label>我的评分
              <input id="f-rating" type="number" min="0" max="10" step="0.5" />
            </label>
            <label>我的状态
              <select id="f-status">
                <option value="unread">未读</option>
                <option value="reading">在读</option>
                <option value="read">已读</option>
              </select>
            </label>
            <label class="favorite-toggle"><input id="f-favorite" type="checkbox" /> 我的收藏</label>
            <label class="comment-field">我的评论/笔记
              <textarea id="f-comment" maxlength="500" rows="3" placeholder="写下你的想法，最多 500 字（仅作记录，所有账号可见）"></textarea>
              <span id="comment-count" class="comment-count">0 / 500</span>
            </label>
            <button id="save-state">保存我的评分</button>
            <span id="state-msg" class="form-msg"></span>
          </div>

          <div class="ratings-box">
            <h3 id="ratings-title">大家的打分</h3>
            <ul id="ratings" class="ratings"></ul>
          </div>

          <div class="actions-row">
            <button id="download">下载原文件</button>
            <button id="edit-book" hidden>修改书籍</button>
            <span id="download-msg" class="form-msg"></span>
          </div>
        </div>
      </section>

      <section class="panel book-shelves">
        <h2>我的书架</h2>
        <p class="muted">书架用于个人或家庭整理，和共享标签各管一件事。</p>
        <div id="shelf-picker" class="shelf-picker"></div>
        <div class="actions-row">
          <button id="save-shelves">保存书架</button>
          <span id="shelves-msg" class="form-msg"></span>
        </div>
      </section>

      <section class="panel book-tag-editor">
        <h2>整理共享标签</h2>
        <form id="tags-form" class="inline-form standard-tags-picker">
          <div id="standard-tag-selects"></div>
          <div class="tag-actions">
            <button type="submit" class="button-primary">保存标签</button>
            <button id="ai-classify-book" class="button-secondary" type="button" hidden>AI 生成标签</button>
          </div>
          <span id="tags-msg" class="form-msg"></span>
          <span id="ai-classify-msg" class="form-msg" aria-live="polite"></span>
        </form>
        <div id="ai-classify-panel" hidden>
          <details id="ai-classify-debug" hidden>
            <summary>模型响应与密钥轮换详情</summary>
            <pre id="ai-classify-debug-content"></pre>
          </details>
        </div>
      </section>

    </main>

    <script type="module" src="/nav.js"></script>
    <script type="module" src="/book.js"></script>
  </body>
</html>
