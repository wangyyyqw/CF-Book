<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CF-Book · 修改书籍</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="library-page edit-page">
    <header class="topbar library-topbar">
      <a class="library-brand" href="/library" aria-label="CF-Book 书库">
        <span class="library-mark">观</span><strong>CF-Book</strong>
      </a>
      <details class="library-menu">
        <summary aria-label="展开导航菜单"><span></span><span></span><span></span></summary>
        <div class="library-menu-list">
          <a href="/library" class="active">书库</a><a href="/">上传</a><a href="/download">下载</a>
          <div id="user-area" class="user-area"></div>
        </div>
      </details>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换到暗色模式">暗色</button>
    </header>
    <main class="shell library-shell">
      <section class="page-heading compact-heading">
        <a id="back-book" class="back-link" href="/library">← 返回详情</a>
        <p class="library-eyebrow">书目 / 编辑</p>
        <h1>补齐一本书的细节</h1>
      </section>
      <section class="panel">
        <h2>修改书籍</h2>
        <div class="book-fields metadata-fields">
          <label class="wide-field">书名<input id="f-title" /></label>
          <label>作者<input id="f-author" /></label>
          <label class="wide-field">简介<textarea id="f-description" rows="4"></textarea></label>
          <label>出版社<input id="f-publisher" /></label>
          <label>ISBN<input id="f-isbn" /></label>
          <label>语言<input id="f-language" /></label>
          <label>格式<input id="f-format" /></label>
          <fieldset id="standard-tags-picker" class="standard-tags-picker wide-field">
            <legend>标准标签（依次选择书籍类型、领域/题材、主题/设定）</legend>
            <div id="standard-tag-selects"></div>
            <div class="tag-actions">
              <button id="ai-classify-book" class="button-secondary" type="button" hidden>AI 生成标签</button>
              <span id="ai-classify-msg" class="form-msg" aria-live="polite"></span>
            </div>
            <details id="ai-classify-debug" hidden>
              <summary>模型响应与密钥轮换详情</summary>
              <pre id="ai-classify-debug-content"></pre>
            </details>
          </fieldset>
        </div>
        <div class="actions-row">
          <button id="save" class="button-primary">保存修改</button>
          <label class="btn-cover" tabindex="0" role="button">上传封面<input id="cover-file" type="file" accept="image/*" hidden /></label>
          <button id="delete" class="danger">删除书籍</button>
          <span id="msg" class="form-msg"></span>
        </div>
      </section>
    </main>
    <script type="module" src="/nav.js"></script>
    <script type="module" src="/edit.js"></script>
  </body>
</html>
